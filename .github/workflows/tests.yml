name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: OPENAI_MODEL= python -m pytest -q
      - run: OPENAI_MODEL= python -m evals.run_eval
      - run: OPENAI_MODEL= python -m evals.run_eval --cases evals/challenge_cases.json
      - run: OPENAI_MODEL= OPENAI_API_KEY= python -m evals.run_product_eval
